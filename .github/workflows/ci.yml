name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flow"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      # CI 전용 로컬 컨테이너 계정
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/flow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm migrate
      - run: pnpm test
